<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Easy Buy - Online Store</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            peach: {
              50: '#fff8f3',
              100: '#ffeade',
              200: '#ffd3b9',
              300: '#ffb88f',
              400: '#ff9f6b',
              500: '#f2733a',
              600: '#e0602a'
            }
          }
        }
      }
    };
  </script>

  <!-- Modular Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-white text-slate-900 font-sans antialiased selection:bg-peach-100 selection:text-peach-600">

  <!-- Header / Navigation Bar -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-peach-100">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
      <a href="#" class="text-xl font-extrabold text-peach-500 tracking-tight">Easy<span class="text-stone-800">Buy</span></a>
      <input 
        id="search" 
        type="search" 
        placeholder="Search products..." 
        aria-label="Search products"
        class="flex-1 rounded-lg border border-peach-200 bg-transparent px-3 py-2 text-sm"
      >
      <button 
        id="openCart" 
        aria-label="Open shopping cart"
        class="relative bg-peach-500 hover:bg-peach-600 active:bg-peach-700 text-white rounded-lg px-4 py-2 text-sm font-semibold transition cursor-pointer"
      >
        Cart <span id="count" class="ml-1 bg-white text-peach-600 rounded-full px-2 py-0.5 text-xs font-bold shadow-xs">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="bg-gradient-to-r from-peach-100 via-peach-200 to-peach-300 text-stone-800">
    <div class="max-w-6xl mx-auto px-4 py-12 md:py-16">
      <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight">Easy shopping, happy savings</h1>
      <p class="mt-3 opacity-90 text-base md:text-lg">Free delivery on orders above &#8377;999. Cash on delivery available.</p>
      <a href="#shop" class="inline-block mt-5 bg-peach-500 hover:bg-peach-600 text-white font-semibold px-6 py-3 rounded-lg shadow-md transition active:scale-95">Shop now</a>
    </div>
  </section>

  <!-- Product Catalog Main Section -->
  <main id="shop" class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex flex-wrap items-center gap-2 mb-6">
      <!-- Category Pills -->
      <div id="cats" class="flex flex-wrap gap-2"></div>
      
      <!-- Sorting Selector -->
      <select id="sort" aria-label="Sort products" class="ml-auto rounded-lg border border-peach-200 bg-white px-3 py-2 text-sm cursor-pointer focus:outline-none focus:border-peach-500">
        <option value="">Sort: Featured</option>
        <option value="asc">Price: Low to High</option>
        <option value="desc">Price: High to Low</option>
        <option value="rate">Top rated</option>
      </select>
    </div>

    <!-- Product Grid -->
    <div id="grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    
    <!-- Empty State -->
    <p id="none" class="hidden text-center text-slate-500 py-12 text-base">No products match your search.</p>
  </main>

  <!-- Cart Drawer Overlay -->
  <div id="overlay" class="hidden fixed inset-0 bg-black/50 backdrop-blur-xs z-40 transition-opacity"></div>

  <!-- Cart Slide-Over Drawer -->
  <aside id="drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-white z-50 translate-x-full transition-transform duration-300 ease-in-out flex flex-col shadow-2xl">
    <div class="flex items-center justify-between p-4 border-b border-peach-100">
      <h2 class="font-bold text-lg text-stone-800">Your cart</h2>
      <button id="closeCart" class="text-2xl text-stone-400 hover:text-stone-700 transition cursor-pointer p-1" aria-label="Close cart">&times;</button>
    </div>
    
    <!-- Cart Items Scrollable Container -->
    <div id="items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    
    <!-- Cart Summary and Checkout -->
    <div class="p-4 border-t border-peach-100 space-y-2 text-sm bg-peach-50/40">
      <div class="flex justify-between text-stone-600"><span>Subtotal</span><b id="sub">&#8377;0</b></div>
      <div class="flex justify-between text-stone-600"><span>Delivery</span><b id="ship">&#8377;0</b></div>
      <div class="flex justify-between text-lg text-stone-900 font-bold pt-1 border-t border-peach-100"><span>Total</span><b id="total">&#8377;0</b></div>
      <button id="checkout" class="w-full mt-3 bg-peach-500 hover:bg-peach-600 active:bg-peach-700 text-white font-semibold py-3 rounded-lg shadow-sm transition cursor-pointer">
        Checkout
      </button>
    </div>
  </aside>

  <!-- Checkout Modal -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xs p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto shadow-2xl animate-fade">
      
      <!-- Checkout Form View -->
      <div id="formView">
        <h2 class="text-xl font-bold mb-4 text-stone-800">Delivery details</h2>
        <div class="space-y-3 text-sm" id="fields"></div>
        <div class="flex gap-3 mt-5">
          <button id="cancel" type="button" class="flex-1 border border-peach-200 hover:bg-peach-50 text-stone-700 rounded-lg py-2 transition font-medium cursor-pointer">Back</button>
          <button id="place" type="button" class="flex-1 bg-peach-500 hover:bg-peach-600 active:bg-peach-700 text-white rounded-lg py-2 font-semibold shadow-sm transition cursor-pointer">Place order</button>
        </div>
      </div>

      <!-- Order Confirmation View -->
      <div id="doneView" class="hidden text-center py-6">
        <div class="text-5xl">&#127881;</div>
        <h2 class="text-xl font-bold mt-3 text-stone-800">Order placed!</h2>
        <p id="orderMsg" class="text-slate-500 mt-2 text-sm"></p>
        <button id="again" type="button" class="mt-5 bg-peach-500 hover:bg-peach-600 active:bg-peach-700 text-white font-semibold rounded-lg px-6 py-2 transition shadow-sm cursor-pointer">Continue shopping</button>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center text-sm text-slate-500 py-8 border-t border-peach-100">
    &copy; 2026 Easy Buy. SaiKet Systems internship, Task 2.
  </footer>

  <!-- Modular JavaScript Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
